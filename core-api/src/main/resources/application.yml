# 基础配置：默认值一律取「线上版本」；环境相关值用 ${ENV:线上默认}。
# 本地开发靠 application-local.yml 把线上默认覆盖回本地值（graphiql/swagger 打开、日志 DEBUG、
#   header 严格、本地 DB/Redis/R2、dev JWT 等）。
# 生产密钥/连接串由环境变量注入（/opt/app/env，见 docs/DEPLOY.md）；个别不便用 env 的项放 application-prod.yml。
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  threads:
    virtual:
      enabled: true
  data:
    redis:
      # 命令级超时：Lettuce 默认 60s——Redis 卡住时 key 池每次 MGET 都要等满 60s 才进降级 catch，
      # 500ms 快速失败（key 池降级放行、限流抛错，均为可接受行为）
      timeout: 500ms
  graphql:
    path: /customer/core/gql
    schema:
      locations: classpath:schema/common/,classpath:schema/customer/

# GraphQL Trusted Documents (persisted query allowlist)
# GReq 入口 /customer/core/greq/{reqName}：path 带 reqName 的请求一律走 allowlist。
# GQL 入口 /customer/core/gql：raw query。
# allow-raw-query 默认 false（生产强制走 persisted query）；local 覆盖为 true 供 GraphiQL/探索。
graphql:
  trusted-documents:
    greq-path: /customer/core/greq
    allow-raw-query: false
    allowlist-path: classpath:graphql/persisted-queries/customer/

dgs:
  graphql:
    path: /customer/core/gql
    graphiql:
      enabled: false            # 生产默认关闭；local 覆盖为 true
      path: /apidocs/core/customer/gql

server:
  port: ${PORT:3001}

# Swagger/OpenAPI 默认关闭；local 覆盖为 enabled 供本地探索。
springdoc:
  api-docs:
    enabled: false
    path: /core/api-docs/json
  swagger-ui:
    enabled: false
    path: /core/api-docs/swagger-ui/index.html
    persist-authorization: true
  use-fqn: true

# 日志默认生产级（INFO / SQL 关）；local 覆盖为 DEBUG。
logging:
  level:
    root: INFO
    org.babyfish.jimmer.sql: WARN
    com.ifmix.core.api: INFO

# actuator 默认只暴露 health、不显详情；local 覆盖放开 env/beans/mappings。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # 生产默认：不外泄内部错误详情；local 覆盖为 true。
  expose-errors: ${APP_EXPOSE_ERRORS:false}
  # header 格式软校验：生产默认 false（非法→WARN 当缺失，不影响请求）；local 覆盖为 true 尽早暴露客户端 bug。
  header-validation:
    strict: ${APP_HEADER_VALIDATION_STRICT:false}
  storage:
    # 连接/密钥（endpoint/access-key/secret-key）由各环境自行配置（local 写死、prod 环境变量）。
    type: ${STORAGE_TYPE:s3}
    region: ${STORAGE_REGION:us-east-1}
    buckets: {}
  pay:
    # Google Play Pub/Sub push 的共享 token：端点按 ?token=xxx 或 X-Webhook-Token 头校验（恒定时间比较）。
    # 未配置时 /webhooks/iap/google 一律 403（IAP 未启用的环境保持关闭，防无鉴权写入）。
    google-webhook-token: ${GOOGLE_WEBHOOK_TOKEN:}
  ai:
    # AI 通用配置（provider 无关；key 池设计见 docs/design/ai-api-key-pool.md）
    model-fallback-order: ""
    # 提示词版本：加载 prompts/${name}_${promptVersion}.md，并随扫描结果落库
    prompt-version: ${SCAN_PROMPT_VERSION:v10}
    # 单次 AI 调用超时（秒）。线上最长调用 ~5min、常 2-3min，默认 6min 覆盖长尾；SDK 内置重试已关闭（maxRetries=0）
    call-timeout-sec: ${AI_CALL_TIMEOUT_SEC:360}
    # 单次扫描总预算（秒，跨模型/attempt 的墙钟上限）：扫描在 GraphQL 请求内同步执行。
    # 剩余时间不足一次 call-timeout 时不发起新 attempt → 在途调用都能在预算内结束；
    # 默认 600 < 2×360：超时一次即结束（换 key 重试只对快速失败生效），见 key-pool 设计「已知取舍」；
    # 必须大于 call-timeout-sec（否则启动失败）；注意网关/客户端超时通常更短，客户端应据此设置自身超时
    scan-deadline-sec: ${AI_SCAN_DEADLINE_SEC:600}
    # 通用 key 池：轮询选取 + Redis 分布式冷却
    apikey-pool:
      # 单次 pick 的探测窗口（一次 MGET 的候选数）；存储侧 clamp 下限 1
      probe-window: 5
      cooldown:
        rate-limited-sec: 300
        invalid-key-sec: 3600    # 401/403 key 失效，长冷却移出轮换
        timeout-sec: 300         # 与典型调用时长（2-3min）对齐，避免超时 key 很快回池
        other-sec: 30

  auth:
    issuer: ${AUTH_ISSUER:ifmix}
    google:
      jwks-uri: ${AUTH_GOOGLE_JWKS_URI:https://accounts.google.com/.well-known/openid-configuration}
    apple:
      jwks-uri: ${AUTH_APPLE_JWKS_URI:https://appleid.apple.com/.well-known/jwks.json}
