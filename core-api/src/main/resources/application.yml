# 基础配置：默认值一律取「线上版本」；环境相关值用 ${ENV:线上默认}。
# 本地开发靠 application-local.yml 把线上默认覆盖回本地值（graphiql/swagger 打开、日志 DEBUG、
#   header 严格、本地 DB/Redis/R2、dev JWT 等）。
# 生产密钥/连接串由环境变量注入（/opt/app/env，见 docs/ops/DEPLOY.md）；个别不便用 env 的项放 application-prod.yml。
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  threads:
    virtual:
      enabled: true
  messages:
    # push 通知等用户可见文案的 i18n 资源（i18n/messages_<locale>.properties，UTF-8）。
    # 找不到对应 locale 时回退到默认 i18n/messages.properties（英文）。
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  data:
    redis:
      # 命令级超时：Lettuce 默认 60s——Redis 卡住时 key 池每次 MGET 都要等满 60s 才进降级 catch，
      # 500ms 快速失败（key 池降级放行、限流抛错，均为可接受行为）
      timeout: 500ms
  graphql:
    path: /customer/core/gql
    schema:
      locations: classpath:schema/common/,classpath:schema/customer/

# GraphQL Trusted Documents (persisted query allowlist)
# GReq 入口 /customer/core/greq/{reqName}：path 带 reqName 的请求一律走 allowlist。
# GQL 入口 /customer/core/gql：raw query。
# allow-raw-query 默认 false（生产强制走 persisted query）；local 覆盖为 true 供 GraphiQL/探索。
graphql:
  trusted-documents:
    greq-path: /customer/core/greq
    allow-raw-query: false
    allowlist-path: classpath:graphql/persisted-queries/customer/

dgs:
  graphql:
    path: /customer/core/gql
    graphiql:
      enabled: false            # 生产默认关闭；local 覆盖为 true
      path: /apidocs/core/customer/gql

server:
  port: ${PORT:3001}

# Swagger/OpenAPI 默认关闭；local 覆盖为 enabled 供本地探索。
springdoc:
  api-docs:
    enabled: false
    path: /core/api-docs/json
  swagger-ui:
    enabled: false
    path: /core/api-docs/swagger-ui/index.html
    persist-authorization: true
  use-fqn: true

# 日志默认生产级（INFO / SQL 关）；local 覆盖为 DEBUG。
logging:
  level:
    root: INFO
    org.babyfish.jimmer.sql: WARN
    com.ifmix.core.api: INFO

# actuator 默认只暴露 health、不显详情；local 覆盖放开 env/beans/mappings。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # 生产默认：不外泄内部错误详情；local 覆盖为 true。
  expose-errors: ${APP_EXPOSE_ERRORS:false}
  # header 格式软校验：生产默认 false（非法→WARN 当缺失，不影响请求）；local 覆盖为 true 尽早暴露客户端 bug。
  header-validation:
    strict: ${APP_HEADER_VALIDATION_STRICT:false}
  # x-wirep-version: 3 wire 加密私钥（RFC 9180 HPKE；X25519 原始 32 字节 base64），格式 `kid:base64,kid:base64`，多 kid 并存以便轮换。
  # 空 = 不支持 v3（v3 请求返回 400003，客户端自动降级明文）。生产用 env WIRE_CRYPTO_KEYS 注入，见 WireCrypto。
  # max-decompressed-bytes：请求 gunzip 后明文上限（防 zip-bomb，超限 400003），默认 1MB，可 env 覆盖。
  wire-crypto:
      mode: required   # /customer/core/** 强制加密（明文/版本不符 → 400004）；optional 仅 local/dev 调试
    keys: ${WIRE_CRYPTO_KEYS:}
    max-decompressed-bytes: ${WIRE_MAX_DECOMPRESSED_BYTES:1048576}
  storage:
    # 连接/密钥（endpoint/access-key/secret-key）由各环境自行配置（local 写死、prod 环境变量）。
    # buckets 按需由环境覆盖 app.storage.buckets.<id>（默认空 map，主配置不留 {} 占位——
    # Boot 4 下空 map 占位会触发 String→Map 绑定失败导致 Spring 上下文起不来）。
    type: ${STORAGE_TYPE:s3}
    region: ${STORAGE_REGION:us-east-1}
  pay:
    # Google Play Pub/Sub push 的共享 token：端点按 ?token=xxx 或 X-Webhook-Token 头校验（恒定时间比较）。
    # 未配置时 /webhooks/iap/google 一律 403（IAP 未启用的环境保持关闭，防无鉴权写入）。
    google-webhook-token: ${GOOGLE_WEBHOOK_TOKEN:}
  ai:
    # AI 通用配置（provider 无关；key 池设计见 docs/design/ai/api-key-pool.md）
    model-fallback-order: ""
    # 提示词版本：加载 prompts/${name}_${promptVersion}.md，并随扫描结果落库
    prompt-version: ${SCAN_PROMPT_VERSION:v10}
    # 单次 AI 调用超时（秒）。线上最长调用 ~5min、常 2-3min，默认 6min 覆盖长尾；SDK 内置重试已关闭（maxRetries=0）
    call-timeout-sec: ${AI_CALL_TIMEOUT_SEC:360}
    # 单次扫描总预算（秒，跨模型/attempt 的墙钟上限）：扫描在 GraphQL 请求内同步执行。
    # 剩余时间不足一次 call-timeout 时不发起新 attempt → 在途调用都能在预算内结束；
    # 默认 600 < 2×360：超时一次即结束（换 key 重试只对快速失败生效），见 key-pool 设计「已知取舍」；
    # 必须大于 call-timeout-sec（否则启动失败）；注意网关/客户端超时通常更短，客户端应据此设置自身超时
    scan-deadline-sec: ${AI_SCAN_DEADLINE_SEC:600}
    # 通用 key 池：轮询选取 + Redis 分布式冷却
    apikey-pool:
      # 单次 pick 的探测窗口（一次 MGET 的候选数）；存储侧 clamp 下限 1
      probe-window: 5
      cooldown:
        rate-limited-sec: 300
        invalid-key-sec: 3600    # 401/403 key 失效，长冷却移出轮换
        timeout-sec: 300         # 与典型调用时长（2-3min）对齐，避免超时 key 很快回池
        other-sec: 30

  # 限流阈值（install attestation 规格 §4.6）：每个 action 显式配置，**重启生效**（不做热更新，
  # 不能当即时 kill switch；紧急降额走一次重启/发布）。key 统一格式 ratelimit:{projectId}:{action}:...，
  # 按 projectId 隔离。IP 层=系统防护（大阈值）；install 层=防滥用（小阈值）；
  # install 层=防滥用（小阈值，attest 接线任务使用）。
  ratelimit:
    install:
      ip-minute: 100          # m_auth_install_create 入口短窗口（所有请求，验签前）
      unverified-ip-day: 100  # createInstall 日窗口：未验证桶（无 proof / INVALID / UNAVAILABLE，OBSERVE 放行）
      attested-ip-day: 1000   # createInstall 日窗口：VALID 已验证桶
    attest-challenge:
      ip-minute: 100          # m_auth_install_createAttestChallenge：纯 HMAC 计算，与 createInstall 入口对齐
    recover-install:
      ip-minute: 10           # m_auth_install_recover
    attest-existing:
      ip-minute: 10           # m_auth_install_attest
      install-day: 3          # 每 install 每 UTC 日新 key 额度
    anonymous:
      ip-minute: 100
      ip-day: 1000
      install-day: 5
    scan:
      ip-minute: 100
      ip-day: 1000
      install-minute: 5
      install-day: 100
    deep-research:
      ip-minute: 100
      ip-day: 1000
      install-minute: 5
      install-day: 100

  auth:
    issuer: ${AUTH_ISSUER:ifmix}

  # install 平台证明（App Attest / Play Integrity，规格 §4.1）：
  # - 全局 kill switch 走 env APP_ATTEST_GLOBAL_ENABLED（Spring 宽松绑定自动映射到 app.attest.global-enabled，默认 false）；
  # - challenge HMAC 密钥走 env APP_ATTEST_CHALLENGE_SECRET（`current[,previous]`，32 字节 base64，不进 yml——secret）；
  # - per-project 配置存 core_project_server_config.app_attest_config（JSONB，null = 关）。
  attest:
    # 全局开关（§4.1）：OFF 时 createAttestChallenge 恒返回 enabled=false，createInstall 不做校验（attestationStatus=30）
    global-enabled: false
    # 验签并发信号量（§3.1：Redis 故障期防验签把进程打满；拿不到许可 → UNAVAILABLE，OBSERVE 放行 / ENFORCE 503002）
    verify-permits: ${APP_ATTEST_VERIFY_PERMITS:32}
    # 老版本 app 兼容：token 无 iid 时退回 x-install-id header（不可信，不签进 token）。
    google:
      jwks-uri: ${AUTH_GOOGLE_JWKS_URI:https://accounts.google.com/.well-known/openid-configuration}
    apple:
      jwks-uri: ${AUTH_APPLE_JWKS_URI:https://appleid.apple.com/.well-known/jwks.json}
