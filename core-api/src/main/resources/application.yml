spring:
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ifmix_core}
    auto-index-creation: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4o}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}

server:
  port: ${PORT:3001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    dgs-graphql:
      enabled: true
      autotime:
        percentiles:
          - 0.5
          - 0.95
          - 0.99

springdoc:
  swagger-ui:
    persist-authorization: true

app:
  expose-errors: ${APP_EXPOSE_ERRORS:true}
  storage:
    type: ${STORAGE_TYPE:none}
    region: ${STORAGE_REGION:us-east-1}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:ifmix}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  agnes:
    # API key 轮换配置：预扣配额（每次扫描尝试预扣 1 次，成功消耗、失败/429 归还）
    ai:
      preDeductPerAttempt: 1
      # 模型回退顺序：主模型 → fallback 列表（按逗号分隔的优先级）
      modelFallbackOrder: "llama-4.0-mini,miro-4"
    # AI 扫描模块专用限流：按 key 维度独立限制（防止单个 key 耗尽）
    scanKeyRateLimit:
      enabled: true
      perKeyWindowSec: 3600
      perKeyMaxAttempts: 50

  auth:
    # JWT 签发者标识
    issuer: ${AUTH_ISSUER:ifmix}
    # Google / Apple JWKS endpoint
    google:
      jwks-uri: ${AUTH_GOOGLE_JWKS_URI:https://accounts.google.com/.well-known/openid-configuration}
    apple:
      jwks-uri: ${AUTH_APPLE_JWKS_URI:https://appleid.apple.com/.well-known/jwks.json}

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: INFO
    org.springframework.boot.autoconfigure.mongo: INFO
    org.mongodb.driver.connection: WARN
    org.mongodb.driver.cluster: INFO
    org.mongodb.driver.protocol.command: INFO

dgs:
  graphql:
    path: /graphql
    graphiql:
      enabled: true
    schema-locations:
      - classpath*:schema/**/*.graphql*
    preparsed-document-provider:
      enabled: true

graphql:
  trusted-documents:
    enabled: false
    allowlist-path: classpath:graphql/persisted-queries/


