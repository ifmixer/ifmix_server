# 本地开发 profile：值写死，不用环境变量。
# 启动：SPRING_PROFILES_ACTIVE=local ./gradlew :core-api:bootRun
# 该文件仅覆盖本地需要改的项，其余沿用 application.yml 的默认值。
spring:
  data:
    redis:
      url: redis://localhost:6379

server:
  port: 3001

app:
  expose-errors: true
  # 本地不接对象存储：用 Noop 实现（返回假 URL），无需 MinIO/R2 即可启动。
  # 需要真实预签名上传时改为 s3 并填下面的凭证。
  storage:
    type: none
    region: us-east-1
    endpoint: http://localhost:9000
    bucket: ifmix
    access-key: minioadmin
    secret-key: minioadmin

  datasource:
    writer:
      jdbc-url: jdbc:postgresql://localhost:5432/ifmix_core_local
      username: postgres
      password: postgres
    reader:
      jdbc-url: jdbc:postgresql://localhost:5432/ifmix_core_local
      username: postgres
      password: postgres

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,env,beans
  endpoint:
    health:
      show-details: always
