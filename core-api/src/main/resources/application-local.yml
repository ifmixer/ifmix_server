# 本地开发 profile：值写死，不用环境变量。
# 启动：SPRING_PROFILES_ACTIVE=local ./gradlew :core-api:bootRun
# 该文件仅覆盖本地需要改的项，其余沿用 application.yml 的默认值。
spring:
  data:
    redis:
      url: redis://localhost:6379
  ai:
    openai:
      base-url: https://apihub.agnes-ai.cn/v1
      chat:
        options:
          model: agnes-2.5-flash
server:
  port: 3001

app:
  expose-errors: true
  # show-sql: true
  # Cloudflare R2（S3 兼容）
  storage:
    type: s3
    region: auto
    endpoint: https://8e70811e74bfc55e99a28b4d9932b452.r2.cloudflarestorage.com
    access-key: 15b38e0cc3ff413c25b4a32cb0fedf47
    secret-key: 0a0ee6be54ab757264efd12069fe1df6533962a975547aa719f3f6f6c627233a
    buckets:
      ugc:
        bucket-name: ugcdev
        public-url: https://u1dev.ifmix.com
      static:
        bucket-name: staticdev
        public-url: https://s1dev.ifmix.com
  agnes:
    ai:
      modelFallbackOrder: ""

  datasource:
    writer:
      jdbc-url: jdbc:postgresql://localhost:5432/ifmix_core_local
      username: postgres
      password: postgres
      maximum-pool-size: 100
    reader:
      jdbc-url: jdbc:postgresql://localhost:5432/ifmix_core_local
      username: postgres
      password: postgres
      maximum-pool-size: 100

logging:
  level:
    # Jimmer SQL 日志
    #org.babyfish.jimmer.sql: DEBUG
    org.babyfish.jimmer.sql: ERROR
    # 项目自身日志
    com.ifmix.api.core: DEBUG
    # 请求/响应日志：DEBUG 打全量，WARN 级别只打错误（默认即可）
    com.ifmix.api.core.infra.http.RequestLoggingFilter: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,env,beans
  endpoint:
    health:
      show-details: always
