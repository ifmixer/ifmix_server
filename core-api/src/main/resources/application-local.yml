# 本地开发 profile：值写死，不用环境变量。
# 启动：SPRING_PROFILES_ACTIVE=local ./gradlew :core-api:bootRun
# 该文件仅覆盖本地需要改的项，其余沿用 application.yml 的默认值。
spring:
  data:
    redis:
      url: redis://localhost:6379
  ai:
    openai:
      base-url: https://apihub.agnes-ai.com/v1
      chat:
        options:
          model: agnes-2.5-flash

server:
  port: 3001

# base 默认关 swagger（生产安全）；local 打开供探索。
# 端点路径用 base 的 /core/... 覆盖值（application.yml springdoc.path），无需在此重复。
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  expose-errors: true
  # 本地 header 格式严格：非法即整个请求报错，尽早暴露客户端 bug（base 默认 false）。
  header-validation:
    strict: true
  # dev 专用 wire key（kid=1，公钥 LS5DEl51a3/c8jNshXdQ4v07vUhElYN4M0KWjSTK+QQ=，客户端 local/dev 预设内置）。
  wire-crypto:
    mode: optional   # 本地允许明文 curl 调试；上线环境必须 required
    keys: '1:V64XjEMXAoqme3StrLwe1+Yt1Z3/BwrJOUCnsuqx2lk='
  show-sql: true
  auth:
    jwt-private-key: '{"kty":"OKP","crv":"Ed25519","kid":"dev-ephemeral","use":"sig","d":"SyR2r1MAt8RrOuvKdIEY1uF-ukq5Ph04yCQKr8GIK10","x":"yPmYi9PmtYaEQpLlvLZRmOL_bCwmYGpzgd4P6iTFIdY"}'
    # 本地 access token 过期时间设为 1 个月（30 天），方便调试不频繁重签
    access-ttl-sec: 2592000
  # Cloudflare R2（S3 兼容）
  storage:
    type: s3
    region: auto
    endpoint: https://8e70811e74bfc55e99a28b4d9932b452.r2.cloudflarestorage.com
    access-key: 15b38e0cc3ff413c25b4a32cb0fedf47
    secret-key: 0a0ee6be54ab757264efd12069fe1df6533962a975547aa719f3f6f6c627233a
    buckets:
      ugc:
        bucket-name: ugcdev
        public-url: https://u1dev.ifmix.com
      static:
        bucket-name: staticdev
        public-url: https://s1dev.ifmix.com

  datasource:
    writer:
      jdbc-url: jdbc:postgresql://localhost:5432/core_api_local
      username: postgres
      password: postgres
      maximum-pool-size: 100
    reader:
      jdbc-url: jdbc:postgresql://localhost:5432/core_api_local
      username: postgres
      password: postgres
      maximum-pool-size: 100

logging:
  level:
    # Jimmer SQL 日志
    #org.babyfish.jimmer.sql: DEBUG
    org.babyfish.jimmer.sql: ERROR
    # 项目自身日志
    com.ifmix.core.api: DEBUG
    # 请求/响应日志：DEBUG 打全量，WARN 级别只打错误（默认即可）
    com.ifmix.core.api.infra.http.RequestLoggingFilter: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,env,beans
  endpoint:
    health:
      show-details: always
