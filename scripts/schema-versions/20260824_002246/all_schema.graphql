# --- common/common.graphqls ---
scalar UUID       # 36-char standard format
scalar DateTime   # ISO-8601 UTC string
scalar JSON       # 透传 JSONB

type OperationResult {
    success: Boolean!
    modifiedCount: Int
}

enum SortDirection {
    ASC
    DESC
}

"通用列表查询参数"
input CommonFindOptions {
    filter: FilterGroup
    cursor: String
    sortBy: String
    sortDirection: SortDirection
    limit: Int
}

type Query
type Mutation


# --- common/filter.graphqls ---
# ===== 通用动态查询 Filter DSL =====
# 支持 AND/OR 嵌套组合，类似 MongoDB 查询语法。
# 所有表共用，后端通过字段白名单控制可查字段。

enum FilterOp {
  EQ
  NE
  GT
  GTE
  LT
  LTE
  IN
  NIN
  LIKE
  IS_NULL
  IS_NOT_NULL
}

"单个字段条件"
input FieldFilter {
  "字段名（需在后端白名单中）"
  field: String!
  "操作符"
  op: FilterOp!
  "标量值（EQ/NE/GT/GTE/LT/LTE/LIKE 使用）"
  value: JSON
  "数组值（IN/NIN 使用）"
  values: [JSON!]
}

"组合条件（支持嵌套）"
input FilterGroup {
  "所有条件取 AND（与 or 二选一，同时填写则 AND 优先）"
  and: [FilterExpr!]
  "所有条件取 OR"
  or: [FilterExpr!]
}

"条件表达式 = 字段条件 | 嵌套组合（二选一）"
input FilterExpr {
  "字段级条件"
  field: FieldFilter
  "嵌套组合"
  group: FilterGroup
}


# --- customer/ai.graphqls ---
# schema/customer/ai.graphqls

# ==================== Scan ====================

type ScanRecord {
    id: UUID!
    images: [ImageRef!]
    "基础扫描结果 (JSONB)"
    basicResult: JSON
    "高级扫描结果 (JSONB)"
    premiumResult: JSON
    "扫描状态。10=PENDING, 11=PROCESSING, 20=COMPLETED, 30=FAILED"
    status: Int!
    clientIp: String
    lang: String
    country: String
    currency: String
    userDisplayName: String
    userNotes: String
    collected: Boolean!
    createdAt: DateTime!
    updatedAt: DateTime
}

type ImageRef {
    key: String!
}

type ScanRecordPage {
    items: [ScanRecord!]!
    nextCursor: String
    hasMore: Boolean!
}

input NewScanInput {
    images: [NewScanImageInput!]!
}

input NewScanImageInput {
    imageKey: String!
    mediaType: String
}

type NewScanResult {
    scanRecord: ScanRecord
}

input UpdateScanInput {
    id: UUID!
    set: UpdateScanSetInput
    unset: [ScanUnsetField!]
}

input UpdateScanSetInput {
    userDisplayName: String
    userNotes: String
    collected: Boolean
}

enum ScanUnsetField { USER_DISPLAY_NAME, USER_NOTES }

type UpdateScanResult {
    success: Boolean!
    scanRecord: ScanRecord
}

type DeleteScanResult {
    success: Boolean!
}

# ==================== Collection ====================

type ScanCollection {
    id: UUID!
    isDefault: Boolean!
    createdAt: DateTime!
}

type ScanCollectionItem {
    id: UUID!
    scanRecord: ScanRecord!
    createdAt: DateTime!
}

type ScanCollectionItemPage {
    items: [ScanCollectionItem!]!
    nextCursor: String
    hasMore: Boolean!
}

input ListScanCollectionItemsInput {
    cursor: String
    limit: Int
}

input AddScanCollectionItemInput {
    scanRecordId: UUID!
}

type AddScanCollectionItemResult {
    collectionId: UUID!
    alreadyExists: Boolean!
}

input RemoveScanCollectionItemsInput {
    scanRecordIds: [UUID!]!
}

type RemoveScanCollectionItemsResult {
    removedCount: Int!
}

# ==================== Query ====================

extend type Query {
    q_ai_findScanById(id: UUID!): ScanRecord!
    "通用动态过滤查询（支持 AND/OR 嵌套条件）"
    q_ai_findMyScans(findOptions: CommonFindOptions): ScanRecordPage!
    q_ai_getDefaultCollection: ScanCollection!
    q_ai_findCollectionItemsByCursor(input: ListScanCollectionItemsInput): ScanCollectionItemPage!
}

# ==================== Mutation ====================

extend type Mutation {
    m_ai_createScan(input: NewScanInput!): NewScanResult!
    m_ai_updateScan(input: UpdateScanInput!): UpdateScanResult!
    m_ai_deleteScan(id: UUID!): DeleteScanResult!
    m_ai_addCollectionItem(input: AddScanCollectionItemInput!): AddScanCollectionItemResult!
    m_ai_removeCollectionItems(input: RemoveScanCollectionItemsInput!): RemoveScanCollectionItemsResult!
}


# --- customer/auth.graphqls ---
type UserInfo {
    id: UUID!
    email: String
}

type LoginResult {
    accessToken: String!
    refreshToken: String!
    expiresIn: Int!
    user: UserInfo!
}

type MeResult {
    user: UserInfo!
    "付费等级。10=FREE, 20=PRO, 30=ENTERPRISE"
    tier: Int!
    tierActive: Boolean!
    tierExpiresAt: DateTime
}

type RefreshResult {
    accessToken: String!
    refreshToken: String!
    expiresIn: Int!
}

input IdpLoginInput {
    idpId: UUID!
    credential: String!
}

input RefreshInput {
    refreshToken: String!
}

input LogoutInput {
    refreshToken: String!
}

extend type Query {
    q_auth_me: MeResult!
}

extend type Mutation {
    m_auth_login(input: IdpLoginInput!): LoginResult!
    m_auth_refreshToken(input: RefreshInput!): RefreshResult!
    m_auth_logout(input: LogoutInput!): OperationResult!
    m_auth_deleteAccount: OperationResult!
}


# --- customer/cms.graphqls ---
input SubmitFeedbackInput {
    scanRecordId: UUID
    """
    反馈分类:
    0=UNKNOWN, 10=LIKED, 20=PRICE_TOO_HIGH, 21=PRICE_TOO_LOW,
    22=PRICE_MISSING, 30=WRONG_IDENTIFICATION, 40=FEATURE_REQUEST,
    41=MORE_RECOMMENDATIONS, 50=WRONG_DATING, 51=WRONG_ORIGIN,
    52=WRONG_CONDITION, 53=WRONG_RARITY, 60=HELPFUL_TIPS
    """
    category: Int!
    """ 所在页面区块（如 valuation / dating / condition / authenticity 等），用于定位反馈来源 """
    section: String
    comment: String
}

type SubmitFeedbackResult {
    id: UUID!
}

extend type Mutation {
    m_cms_submitFeedback(input: SubmitFeedbackInput!): SubmitFeedbackResult!
}


# --- customer/demo.graphqls ---
type Todo {
    id: UUID!
    title: String!
    done: Boolean!
    note: String          # nullable — 演示 unset
    meta: JSON
    recommend: TodoRecommend
    items: [TodoItem!]!
    itemCount: Int!
    pendingCount: Int!
    finishCount: Int!
    createdAt: DateTime!
    updatedAt: DateTime
}

type TodoRecommend {
    sectionId: UUID!
    sectionName: String!
    viewCount: Int
    recItems: [TodoRecItem!]
}

type TodoRecItem {
    recId: UUID!
    title: String
    priority: Int!
    createdAt: DateTime!
    updatedAt: DateTime
}

type TodoItem {
    id: UUID!
    content: String!
    done: Boolean!
    note: String          # nullable — 演示 unset
    createdAt: DateTime!
    updatedAt: DateTime
}

# --- Query ---

type TodoPage {
    items: [Todo!]!
    nextCursor: String
    hasMore: Boolean!
}

extend type Query {
    q_demo_findTodoById(id: UUID!): Todo!
    q_demo_findTodosByIds(ids: [UUID!]!): [Todo!]!
    "动态条件查询。可过滤字段: title(String), done(Boolean), userId(UUID), note(String), createdAt(DateTime), updatedAt(DateTime)"
    q_demo_findTodos(findOptions: CommonFindOptions): TodoPage!
}

# --- Mutation: Create ---
input CreateTodoInput {
    title: String!
    done: Boolean
    note: String
    recommend: TodoRecommendInput
    items: [CreateTodoItemInput!]   # 嵌入子实体
}

input CreateTodoItemInput {
    content: String!
    done: Boolean
    note: String
}

input TodoRecommendInput {
    sectionId: UUID!
    sectionName: String!
    viewCount: Int
    recItems: [TodoRecItemInput!]
}

input TodoRecItemInput {
    recId: UUID!
    title: String
    priority: Int!
    createdAt: DateTime!
    updatedAt: DateTime
}

type CreateTodoResult {
    todo: Todo!
}

# --- Mutation: Update Todo ---
input UpdateTodoInput {
    id: UUID!
    set: UpdateTodoSetInput
    unset: [TodoUnsetField!]
}

input UpdateTodoSetInput {
    title: String
    done: Boolean
    note: String
    recommend: TodoRecommendInput
}

enum TodoUnsetField {
    NOTE
    RECOMMEND
}

type UpdateTodoResult {
    success: Boolean!
    todo: Todo
}

# --- Mutation: Update TodoItems（独立，不需要 todoId） ---
input UpdateTodoItemsMutationInput {
    create: [CreateTodoItemForTodoInput!]
    update: [UpdateTodoItemInput!]
    delete: [UUID!]
}

input CreateTodoItemForTodoInput {
    todoId: UUID!
    content: String!
    done: Boolean
    note: String
}

input UpdateTodoItemInput {
    id: UUID!                      # 通过 id 定位，不需要 todoId
    set: UpdateTodoItemSetInput
    unset: [TodoItemUnsetField!]
}

input UpdateTodoItemSetInput {
    content: String
    done: Boolean
    note: String
}

enum TodoItemUnsetField {
    NOTE
}

type UpdateTodoItemsResult {
    success: Boolean!
}

# --- Mutation: Delete ---

extend type Mutation {
    m_demo_createTodo(input: CreateTodoInput!): CreateTodoResult!
    m_demo_updateTodo(input: UpdateTodoInput!): UpdateTodoResult!
    m_demo_batchUpdateTodoItems(input: UpdateTodoItemsMutationInput!): UpdateTodoItemsResult!
    m_demo_deleteTodo(id: UUID!): OperationResult!
    m_demo_deleteTodoByIds(ids: [UUID!]!): OperationResult!
}


